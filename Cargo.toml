[package]
name = "mirl_extensions_math"
version = "0.0.0-alpha"
edition = "2024"
repository.workspace = true
[features]
default = ["std"]
std = [
    "mirl_extensions_conversion/std",
    "mirl_extensions_core/std",
    "mirl_graphics/std",
    "num-bigfloat?/std",
    "num-bigint?/std",
    "num-traits?/std",
    "fixed?/std",
]
all = [
    "bigint",
    "bigfloat",
    "mirl_extensions_core/all",
    "mirl_graphics/all",
    "fixed",
]
bigint = [
    "dep:num-bigint",
    "dep:num-traits",
    "mirl_extensions_conversion/bigint",
    "mirl_extensions_core/bigint",
]
bigfloat = [
    "dep:num-bigfloat",
    "mirl_extensions_conversion/bigfloat",
    "mirl_extensions_core/bigfloat",
]
_checking = ["all", "test"]
fixed = ["dep:fixed", "mirl_extensions_core/fixed"]
test = ["mirl_extensions_core/test"]
[dependencies]
fixed = { version = "1.31.0", optional = true, features = [
    "f16",
    "nightly-float",
] }
mirl_extensions_conversion = { version = "0.0.0-alpha" }
mirl_extensions_core = { version = "0.0.0-alpha" }
# mirl_core = { version = "0.0.0-alpha" }
mirl_graphics = { version = "0.0.0-alpha" }
num-bigfloat = { version = "1.7", optional = true }
### Number crates
num-bigint = { version = "0.5", optional = true }
num-traits = { version = "0.2.19", optional = true, no_default_features = true }

[build-dependencies]
mirl_build_tools = { version = "0.0.0-alpha" }
[lints]
workspace = true
